<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="dark:bg-black dark:text-white">
    <div></div>
    <div>
      <div class="navbar bg-primary text-primary-content dark:bg-slate-800">
        <button class="btn btn-ghost text-xl">Grid - with Tailwind</button>
      </div>
    </div>
    <section>
      <div class="flex flex-col sm:flex-row p-10 gap-6 items-center">
        <div class="md:w-1/2">
          <h3 class="text-5xl font-bold md:text-7xl">
            Discover The World's <br class="hidden md:block" />
            <span class="opacity-55">Hidden</span> Wonder
          </h3>
          <p class="text-left mt-10 mb-10">
            Lorem, ipsum dolor sit amet consectetur adipisicing elit. Facilis
            provident numquam neque hic doloremque dignissimos fugiat omnis ea
            error illum inventore quam optio animi officia, repellat sint ipsam
            praesentium quisquam.
          </p>
          <button class="btn">
            <span class="loading loading-spinner"></span>
            loading
          </button>
        </div>

        <div
          class="md:p-8 grid grid-cols-4 grid-rows-6 gap-5 md:grid md:grid-cols-4 md:grid-rows-6 md:h-[90vh] md:w-1/2"
        >
          <div class="row-start-1 row-end-8 col-span-2">
            <img
              class="h-full w-full rounded-2xl md:object-cover"
              src="https://images.unsplash.com/photo-1593353798398-6024b7444bb6?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt=""
            />
          </div>
          <div class="row-start-1 row-span-4 col-start-3 col-span-2">
            <img
              class="h-full w-full rounded-2xl"
              src="https://images.pexels.com/photos/27860371/pexels-photo-27860371/free-photo-of-street-food.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
              alt=""
            />
          </div>
          <div class="row-start-5 row-span-3 col-span-2">
            <img
              class="h-full w-full rounded-2xl"
              src="https://images.pexels.com/photos/30550052/pexels-photo-30550052/free-photo-of-wind-turbines-in-foggy-a-pobra-do-caraminal.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr="
              alt=""
            />
          </div>
        </div>
      </div>
    </section>
    <section class="p-10">
      <div class="carousel w-full">
        <div id="item1" class="carousel-item w-full">
          <img
            src="https://img.daisyui.com/images/stock/photo-1625726411847-8cbb60cc71e6.webp"
            class="w-full"
          />
        </div>
        <div id="item2" class="carousel-item w-full">
          <img
            src="https://img.daisyui.com/images/stock/photo-1609621838510-5ad474b7d25d.webp"
            class="w-full"
          />
        </div>
        <div id="item3" class="carousel-item w-full">
          <img
            src="https://img.daisyui.com/images/stock/photo-1414694762283-acccc27bca85.webp"
            class="w-full"
          />
        </div>
        <div id="item4" class="carousel-item w-full">
          <img
            src="https://img.daisyui.com/images/stock/photo-1665553365602-b2fb8e5d1707.webp"
            class="w-full"
          />
        </div>
      </div>
      <div class="flex w-full justify-center gap-2 py-2">
        <a href="#item1" class="btn btn-xs">1</a>
        <a href="#item2" class="btn btn-xs">2</a>
        <a href="#item3" class="btn btn-xs">3</a>
        <a href="#item4" class="btn btn-xs">4</a>
      </div>
    </section>
  </body>
</html>
